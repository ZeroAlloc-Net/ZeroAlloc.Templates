name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode: read release-please-config.json + .release-please-manifest.json
          # from the repo root. Matches the convention used across ZeroAlloc-Net repos.
          # The csproj <Version> is overridden at pack time via -p:Version=,
          # so release-please doesn't need to edit the csproj.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  # Builds the release tag, packs the template, checks the version inside the package, pushes
  # it, and waits until nuget.org serves it. Shared from ZeroAlloc-Net/.github so a fix there
  # reaches every repository; see ZeroAlloc-Net/.github#49. -p:Version is passed to build and
  # pack, so the ZAVERSION guard in ZeroAlloc.Templates.csproj sees the release version.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ZeroAlloc-Net/.github/.github/workflows/publish.yml@main
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      solution: ZeroAlloc.Templates.slnx
      # The repository's only package is ZeroAlloc.Templates.csproj at the root. A directory
      # pack-root would be the root itself, and discovery would then also evaluate the MyApp.*
      # projects under content/, which ship as template content, not as packages: the Domain,
      # Application and Infrastructure ones evaluate as IsPackable=true. Pointing pack-root at
      # the project file keeps discovery to exactly that one project, without touching the
      # template content that scaffolded apps receive.
      pack-root: ZeroAlloc.Templates.csproj
      # The checks the publish job ran before this migration: the za-clean content builds with
      # no warnings and its tests pass, then the smoke tests scaffold both templates from
      # content/, build them with -warnaserror and run their tests. The content is not part of
      # ZeroAlloc.Templates.slnx, so the default test step alone would skip the first two.
      test-command: |
        dotnet build content/za-clean/MyApp.slnx -c Release -warnaserror
        dotnet test content/za-clean/MyApp.slnx -c Release --no-build
        dotnet test ZeroAlloc.Templates.slnx -c Release --no-build
      # The destinations this repository already had: nuget.org and the release assets.
      github-packages: false
      release-assets: true
      # Trusted publishing: set the NUGET_USER variable and add a trusted publisher policy on
      # nuget.org for this repository and workflow to stop using the NUGET_API_KEY secret below.
      nuget-user: ${{ vars.NUGET_USER }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # A CycloneDX SBOM per release, attached to the GitHub release that release-please created in the
  # job above. It runs in its own job because publish is a shared reusable workflow, which takes no
  # extra steps. It builds the release tag, not main, so the SBOMs describe exactly the released
  # code, and it waits for publish so the release build has passed first. The template package
  # itself carries no package dependencies; the two template solutions under content/ hold the
  # packages a scaffolded app gets, so each of them gets its own SBOM as well.
  sbom:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Build the release
        run: dotnet build ZeroAlloc.Templates.slnx -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Attach the template package SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: ZeroAlloc.Templates.slnx
          tag: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach the za-clean template SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: content/za-clean/MyApp.slnx
          tag: ${{ needs.release-please.outputs.tag_name }}
          output-name: ${{ needs.release-please.outputs.tag_name }}-za-clean.cdx.json

      - name: Attach the za-vertical-slice template SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: content/za-vertical-slice/MyApp.slnx
          tag: ${{ needs.release-please.outputs.tag_name }}
          output-name: ${{ needs.release-please.outputs.tag_name }}-za-vertical-slice.cdx.json
