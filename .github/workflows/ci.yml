name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify root vs content/za-clean config files match
        run: |
          for file in Directory.Build.props Directory.Packages.props global.json; do
            if ! diff -q "$file" "content/za-clean/$file" > /dev/null; then
              echo "::error::$file has drifted between repo root and content/za-clean/"
              diff "$file" "content/za-clean/$file" || true
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore (content)
        run: dotnet restore content/za-clean/MyApp.slnx

      - name: Build (content)
        run: dotnet build content/za-clean/MyApp.slnx --no-restore --configuration Release

      - name: Test (content)
        run: dotnet test content/za-clean/MyApp.slnx --no-build --configuration Release --logger "GitHubActions;summary.includePassedTests=false"

      - name: Pack template
        run: dotnet pack ZeroAlloc.Templates.csproj -c Release -o ./nupkg

      - name: Restore (smoke test)
        run: dotnet restore tests/ZeroAlloc.Templates.SmokeTests/ZeroAlloc.Templates.SmokeTests.csproj

      - name: Test (smoke)
        # Smoke test installs the freshly-packed template, scaffolds it into a
        # temp directory, then builds + tests the scaffolded solution. This is
        # the gate that catches "we changed a ZA package and the template no
        # longer scaffolds."
        run: dotnet test tests/ZeroAlloc.Templates.SmokeTests --configuration Release --logger "GitHubActions"

      - name: Upload nupkg artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ZeroAlloc.Templates.nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
