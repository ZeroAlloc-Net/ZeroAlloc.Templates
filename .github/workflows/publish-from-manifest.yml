name: Publish from manifest

# Manual rescue: publishes the release recorded in .release-please-manifest.json when the
# automatic publish did not, for example after a dropped push event or a failed push.
# It runs the same shared workflow as the release itself, against the release tag, so it
# rebuilds exactly the released code even after main has moved on, and it confirms that
# every package reached nuget.org. --skip-duplicate makes re-runs safe.
#
# This repository had no rescue workflow, so a dropped push event stranded 0.16.1 with no safe
# way to publish it; see the 2026-10-15 incident on ZeroAlloc-Net/.github#49.
#
# Usage:
#   gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.Templates
#   gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.Templates -f dry-run=true

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, pack and verify only; push nothing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the manifest version and find its tag
        id: manifest
        run: |
          set -euo pipefail
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if [ -z "$version" ]; then
            echo "::error::.release-please-manifest.json has no \".\" entry"
            exit 1
          fi
          # release-please-config.json names the package and leaves include-component-in-tag at
          # its default, so the release tags carry the component: ZeroAlloc.Templates-v0.16.2.
          tag="ZeroAlloc.Templates-v$version"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::the manifest says $version but tag $tag does not exist; nothing was released to rescue"
            exit 1
          fi
          echo "Rescuing $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    uses: ZeroAlloc-Net/.github/.github/workflows/publish.yml@main
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      solution: ZeroAlloc.Templates.slnx
      # The same inputs as the release's own publish job in release-please.yml; see the comments
      # there.
      pack-root: ZeroAlloc.Templates.csproj
      test-command: |
        dotnet build content/za-clean/MyApp.slnx -c Release -warnaserror
        dotnet test content/za-clean/MyApp.slnx -c Release --no-build
        dotnet test ZeroAlloc.Templates.slnx -c Release --no-build
      github-packages: false
      release-assets: true
      dry-run: ${{ inputs.dry-run }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
