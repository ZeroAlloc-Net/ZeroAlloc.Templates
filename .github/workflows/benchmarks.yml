name: Benchmarks (manual)

# Manual BenchmarkDotNet + NBomber runs for both templates. Triggered via
# the GitHub Actions UI ("Run workflow"). Each leg uploads its artifacts —
# bdn-* for BenchmarkDotNet, nbomber-* for NBomber.
#
# Two jobs:
#   - benchmark (matrix): BDN Primitives + WritePipeline for both templates.
#     The za-vertical-slice/WritePipeline leg cross-products SQLite + Postgres
#     via WritePipelineBench's [Params] DbBackend.
#   - nbomber-postgres-vs: za-vertical-slice load test against real Postgres.
#     Distinct from the BDN matrix because it spins up the SUT as a separate
#     process. Postgres is the only sensible load-test target — SQLite's
#     single-process file lock caps at ~470 RPS. The CI-fragility concern
#     that originally kept NBomber out of CI is mitigated by colocation
#     (SUT runs on the same runner as NBomber, no cross-host network).
#     If the job becomes a frequent retry-magnet, demote to manual-only.
#
# Skipped intentionally:
#   - AOT-published benchmarks (the existing aot-smoke job already proves
#     AOT compatibility; JIT numbers are the regression net).

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.template }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres attaches at job level (GHA has no per-leg services syntax), so
    # all 4 matrix legs receive the container. Only za-vertical-slice /
    # WritePipeline actually consumes it via WritePipelineBench's [Params]
    # DbBackend.Postgres profile. Cost: ~150MB cached image pull + ~3s startup
    # per leg, negligible against the 30-min budget. See
    # docs/plans/2026-05-28-postgres-bench-profile-design.md §CI workflow.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: za-clean
            suite: Primitives
            project: benchmarks/MyApp.Benchmarks.Primitives
            filter: "*"
          - template: za-clean
            suite: WritePipeline
            project: benchmarks/MyApp.Benchmarks
            filter: "*WritePipelineBench*"
          - template: za-vertical-slice
            suite: Primitives
            project: benchmarks/MyApp.Benchmarks.Primitives
            filter: "*"
          - template: za-vertical-slice
            suite: WritePipeline
            project: benchmarks/MyApp.Benchmarks
            filter: "*WritePipelineBench*"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Pin the working directory to the specific benchmark project so BDN's
      # project-file search doesn't collide with the identically-named sibling
      # project in the other template.
      - name: Restore
        working-directory: content/${{ matrix.template }}/${{ matrix.project }}
        run: dotnet restore

      - name: Build
        working-directory: content/${{ matrix.template }}/${{ matrix.project }}
        run: dotnet build -c Release --no-restore

      - name: Run BenchmarkDotNet
        working-directory: content/${{ matrix.template }}/${{ matrix.project }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: bench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: dotnet run -c Release --no-build -- --filter "${{ matrix.filter }}" --exporters github

      - name: Upload BDN artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdn-${{ matrix.template }}-${{ matrix.suite }}
          path: content/${{ matrix.template }}/${{ matrix.project }}/BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
          retention-days: 30

  nbomber-postgres-vs:
    name: za-vertical-slice / NBomber-Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB_NAME: myapp_load
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ env.POSTGRES_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build SUT
        working-directory: content/za-vertical-slice
        run: dotnet build src/MyApp -c Release

      - name: Build LoadTest
        working-directory: content/za-vertical-slice
        run: dotnet build benchmarks/MyApp.LoadTest -c Release

      - name: Start SUT against Postgres
        working-directory: content/za-vertical-slice
        env:
          Database__Provider: Postgres
          Database__SchemaStrategy: EnsureCreated
          ConnectionStrings__Default: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=${{ env.POSTGRES_DB_NAME }}"
          ASPNETCORE_URLS: "http://localhost:5000"
        run: |
          setsid nohup dotnet run -c Release --no-build --project src/MyApp > sut.log 2>&1 &
          echo $! > sut.pid

      - name: Wait for /healthz
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/healthz > /dev/null; then
              echo "SUT healthy after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat content/za-vertical-slice/sut.pid)" 2>/dev/null; then
              echo "SUT process died before becoming healthy — dumping log"
              cat content/za-vertical-slice/sut.log
              exit 1
            fi
            sleep 1
          done
          echo "SUT did not become healthy in 60s — dumping log"
          cat content/za-vertical-slice/sut.log
          exit 1

      - name: Run NBomber
        working-directory: content/za-vertical-slice
        run: dotnet run -c Release --no-build --project benchmarks/MyApp.LoadTest -- http://localhost:5000

      - name: Stop SUT
        if: always()
        working-directory: content/za-vertical-slice
        run: |
          if [ -f sut.pid ]; then
            # `-PID` (negative PID) signals the entire process group — dotnet run may
            # spawn the app as a child, and killing only the launcher would leave the
            # SUT bound to port 5000 until container teardown.
            kill -TERM -"$(cat sut.pid)" || true
          fi

      - name: Upload NBomber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nbomber-za-vertical-slice-postgres
          path: content/za-vertical-slice/reports/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SUT log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nbomber-sut-log
          path: content/za-vertical-slice/sut.log
          if-no-files-found: warn
          retention-days: 7
