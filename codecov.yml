# The project status is the ci-baseline v1 block: the coverage-gate step in CI fails when it is
# missing, informational or looser than this. The patch status is not governed by the baseline
# and stays informational.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
  - "benchmarks/**"
  - "samples/**"
  - "**/obj/**"
  - "**/*.g.cs"
  - "**/tests/**"
  - "**/benchmarks/**"
